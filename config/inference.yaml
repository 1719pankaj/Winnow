model_policy:
  fast:
    rerank: {order_by: output_speed, min_intelligence: 20}
    plan: {order_by: output_speed}
  right:
    rerank: {order_by: intelligence, min_speed_tps: 20}
    plan: {order_by: intelligence}
  fallback_chain:
    - or-glm-5-3-flash
    - or-gemini-3.7-flash
    - or-minimax-m3-free
    - or-nemotron-3-ultra-free
    - groq-gpt-120b
    - groq-qwen-27b
    - nim-nemotron-3-ultra
    - or-deepseek-v4-pro
    - or-gemma-4-31b-free
    - or-gemma-4-26b-legacy
    - or-dots-3-note-legacy
    - or-free-router
  embed_model: or-gemini-3.7-flash
  refresh_metrics_every_hours: 24

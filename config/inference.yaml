inference_providers:
  - name: groq
    enabled: true
    base_url: https://api.groq.com/openai/v1
    api_key: ${GROQ_KEY}
    timeout_ms: 20000
    limits: {rpm: 60, rpd: 10000, concurrent: 6}

  - name: gemini
    enabled: true
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key: ${GEMINI_AI_STUDIO_KEY}
    timeout_ms: 30000
    limits: {rpm: 60, rpd: 5000, concurrent: 6}

  - name: nim
    enabled: true
    base_url: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_NIM_API_KEY}
    timeout_ms: 30000
    limits: {rpm: 60, rpd: 10000, concurrent: 6}

  - name: openrouter
    enabled: true
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPEN_ROUTER_API_KEY}
    timeout_ms: 30000
    limits: {rpm: 60, rpd: 5000, concurrent: 6}
    extra_headers:
      HTTP-Referer: http://localhost:3000
      X-Title: Winnow

